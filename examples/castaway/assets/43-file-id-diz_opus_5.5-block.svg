<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 216" width="784" height="432" shape-rendering="crispEdges" role="img" aria-labelledby="t d">
<title id="t">Castaway: FILE_ID.DIZ, block variant</title>
<desc id="d">The Castaway theme's own FILE_ID.DIZ, in a DOS file viewer: light grey on black, 45 columns by 10 lines. 80BPM in solid half-block letters fills the top seven lines, and every empty cell around and inside the letters is a dimmer capital letter. Read in order, the capitals say: Every sound is made from code. No samples, no recordings. The ocean loops every minute. Nobody has heard any of it yet. Respect to the shark for keeping time. zZ of ONEBAR. Below the logo: CASTAWAY OST: THEME.WAV, 60 S LOOP .. [01/20]; 80 BPM. F MAJOR. II-V-I-VI. 20 BARS OF 3 S; SYNTHESIZED FROM CODE.  ONEBAR / zZ. The viewer's status line reads FILE_ID.DIZ 45 X 10, READ THE GAPS, and an inverse-video cursor reads the hidden message out, one letter at a time.</desc>
<style>
.ink{fill:#b4b4b4}
.dim{fill:#b4b4b4;opacity:.66}
.inv{fill:#08090c}
@media (prefers-reduced-motion: reduce){.cursor{display:none}}
</style>
