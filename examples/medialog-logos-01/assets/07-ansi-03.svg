<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Little culture goblin</title><desc id="d">An original pocket-sized mascot: a happy little creature made from a saved story. Thick comic outlines, cream lettering and a purple swoosh keep it clear at tiny sizes.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The mascot is a folded saved-story shape with a face, not a generic animal; Its raised hand turns the logo into a friendly invitation to share a favourite.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


