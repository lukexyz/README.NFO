<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Save-slot romance</title><desc id="d">A chunky multicolour save-slot heart, with six little timeline moments riding a soft demo-scene wave.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The emblem is a save slot that resolves into a heart; Six dots stand for films, books, shows, games, albums and podcasts, with no tiny labels.</desc><defs><linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecfaff"/><stop offset="0.34" stop-color="#ecfaff"/><stop offset="0.34" stop-color="#83daed"/><stop offset="0.64" stop-color="#83daed"/><stop offset="0.64" stop-color="#788ad7"/><stop offset="1" stop-color="#788ad7"/></linearGradient><linearGradient id="ramp-type" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="77"><stop offset="0" stop-color="#ecfaff"/><stop offset="0.34" stop-color="#ecfaff"/><stop offset="0.34" stop-color="#83daed"/><stop offset="0.64" stop-color="#83daed"/><stop offset="0.64" stop-color="#788ad7"/><stop offset="1" stop-color="#788ad7"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}
.note{animation:sine 4s ease-in-out infinite}@keyframes sine{50%{transform:translateY(-7px)}}

