<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Orbit trace</title><desc id="d">A glowing play arrow sits inside an orbital timeline. One clean phosphor line carries the brand.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; Two bright points on the orbit read as shared moments; The triangular trace suggests watching, while the orbit supplies the timeline.</desc><defs><filter id="halo" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="6"/></filter></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

