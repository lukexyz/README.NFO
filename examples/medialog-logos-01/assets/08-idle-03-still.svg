<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Still feeling it</title><desc id="d">A heart glows inside a feedback flame: the film, book or album that stays with you. A short cooling waveform becomes the underline.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The flame’s core is a heart, making the effect about feeling rather than speed; The fading waveform is the echo of an experience that remains on your timeline.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

