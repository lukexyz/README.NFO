<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Museum of you</title><desc id="d">A marble heart on a tiny plinth: the things you love become your personal collection. Mint lettering and a pink checker plinth keep the vaporwave reference instantly readable.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; An original heart sculpture replaces the historical bust; The checker plinth turns personal taste into a miniature collection.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


