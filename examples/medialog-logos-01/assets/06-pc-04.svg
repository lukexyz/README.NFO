<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Memory vault</title><desc id="d">A chrome ML medallion and a heavy metal wordmark, crossed by pink VGA bars. Like a collector’s badge for your own cultural history.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; An interlocked ML makes the icon work as a standalone avatar; The two gradient rails join emblem and title like tracks through a collection.</desc><defs><linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.17" stop-color="#b3defb"/><stop offset="0.46" stop-color="#637ab7"/><stop offset="0.49" stop-color="#f5fdff"/><stop offset="0.53" stop-color="#fff"/><stop offset="0.56" stop-color="#3e2945"/><stop offset="0.74" stop-color="#ac7687"/><stop offset="1" stop-color="#efcbb4"/></linearGradient><linearGradient id="chrome-type" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="77"><stop offset="0" stop-color="#fff"/><stop offset="0.17" stop-color="#b3defb"/><stop offset="0.46" stop-color="#637ab7"/><stop offset="0.49" stop-color="#f5fdff"/><stop offset="0.53" stop-color="#fff"/><stop offset="0.56" stop-color="#3e2945"/><stop offset="0.74" stop-color="#ac7687"/><stop offset="1" stop-color="#efcbb4"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#59457f"/><stop offset="0.45" stop-color="#ff9ade"/><stop offset="0.65" stop-color="#d060b9"/><stop offset="1" stop-color="#3d386a"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


