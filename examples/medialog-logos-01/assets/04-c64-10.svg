<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Good company</title><desc id="d">Two friends inside a record-like circle, paired with a gently curved wordmark and a stepped stripe. Bold shapes, warm colours, no fine print.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The circle combines a record groove with a shared social space; Two silhouettes and the continuous stepped baseline turn the diary into something you share.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


