<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Signal saved</title><desc id="d">A play button becomes a saved moment and a conversation. Cyan and pink signal offsets give the mark a clean, deliberate glitch.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; One speech-tail mark joins experiencing and sharing; The timeline ends in a saved pink dot; glitch is confined to one small stripe.</desc><defs><clipPath id="slice"><rect x="237" y="136" width="560" height="8"/></clipPath></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}
.echo{clip-path:url(#slice);opacity:.8;animation:echo 8s steps(1,end) infinite}@keyframes echo{0%,87%,94%,100%{transform:translateX(0)}89%,92%{transform:translateX(10px)}}

