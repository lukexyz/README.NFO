<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — One more watch</title><desc id="d">An oversized oblique wordmark above a compressed timeline-disc. A restrained screensaver ricochet changes colour while the name stays easy to read.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The disc carries three saved moments instead of a secondary tiny caption; Motion is kept within a few screen pixels so the mark remains a usable navigation logo.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}
.bounce{animation:ricochet 16s linear infinite}@keyframes ricochet{0%,100%{transform:translate(-12px,-6px);color:#ab9bff}25%{transform:translate(12px,5px);color:#6ee8d6}50%{transform:translate(-12px,5px);color:#f3a5d5}75%{transform:translate(12px,-6px);color:#ffd886}}
*{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x="22" y="32" width="768" height="235" fill="#101724" rx="28"/><g class="bounce" style="color:#ab9bff"><g transform="translate(126 66) scale(1.2058212058212059 1.2)" ><g transform="skewX(-12)" ><g transform="translate(0 0)" ><path d="M7 77V9L33 42L59 9V77" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(73 0)" ><path d="M46 9H8V77H46M8 43H39" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(133 0)" ><path d="M8 77V9H36L51 25V61L36 77Z" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(199 0)" ><path d="M12 9V77" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(230 0)" ><path d="M6 77L23 9H37L54 77M16 49H45" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(297 0)" ><path d="M8 9V77H45" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(354 0)" ><path d="M20 9H40L52 22V65L40 77H20L8 65V22Z" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(421 0)" ><path d="M51 23L39 9H20L8 22V65L20 77H49V45H33" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /></g></g></g><ellipse cx="397" cy="213" rx="267" ry="25" fill="currentColor"/><path d="M168 213Q304 192 413 207Q534 226 625 208" fill="none" stroke="#101724" stroke-width="5"/><circle cx="244" cy="205" r="7" fill="#101724" /><circle cx="415" cy="208" r="7" fill="#101724" /><circle cx="570" cy="214" r="7" fill="#101724" /></g></svg>
