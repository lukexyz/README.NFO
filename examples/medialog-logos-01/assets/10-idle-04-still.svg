<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Taste constellation</title><desc id="d">Six coloured waveform loops share one centre: all your kinds of media, and the tastes that overlap with your friends. A gentle visualiser motion keeps the emblem alive.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; Six loops represent the six media types named in the brief; The overlapping orbits describe shared taste, while one line connects the whole name.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}
.constellation{transform-origin:121px 146px;animation:breathe 12s ease-in-out infinite}@keyframes breathe{50%{transform:rotate(8deg) scale(.95)}}
*{animation:none!important;transition:none!important}
