<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Now showing symbol</title><desc id="d">A video-recorder front panel reads ▶ 1:58 in teal fluorescent segments behind smoked glass, with an orange film-reel annunciator and a progress bar most of the way through. Primary brand colour #18223a, plain MediaLog wordmark. Seven-segment digits keep their ghosted unlit segments; annunciators become play, pause, record and a film reel; A runtime and a part-filled progress bar make the panel about watching films, not hi-fi; no lettering is used.</desc><defs><linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1" ><stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/></linearGradient><filter id="vfd" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="amber" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M34 74H206A20 20 0 0 1 226 94V202A20 20 0 0 1 206 222H34A20 20 0 0 1 14 202V94A20 20 0 0 1 34 74Z" fill="#071214" stroke="var(--rim)" stroke-width="3"/><g transform="translate(0 150) skewX(-7) translate(0 -150)" opacity=".1"><path d="M64.48 124.5L68.98 120L81.02 120L85.52 124.5L81.02 129L68.98 129Z" fill="#8ff5dc" /><path d="M64.48 151L68.98 146.5L81.02 146.5L85.52 151L81.02 155.5L68.98 155.5Z" fill