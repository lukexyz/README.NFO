<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — On air symbol</title><desc id="d">A podcast microphone stands at the centre of a four-fold light-synth mandala: chunky seed patterns ripple outward through seven colours, from cream and amber to deep blue. Primary brand colour #18223a, plain MediaLog wordmark. Seeds expand through seven levels on a coarse cell grid and are mirrored through both axes, as in the light synth; The pattern frames a microphone so the symbol reads as listening and talking: podcasts.</desc><defs><clipPath id="field"><path d="M40 52H200A20 20 0 0 1 220 72V232A20 20 0 0 1 200 252H40A20 20 0 0 1 20 232V72A20 20 0 0 1 40 52Z"/></clipPath></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><g clip-path="url(#field)"><rect x="20" y="52" width="200" height="200" fill="#0b0f1c" /><rect x="120.6" y="188.6" width="10.8" height="10.8" fill="#f6e7c1" /><rect x="108.6" y="188.6" width="10.8" height="10.8" fill="#f6e7c1" /><rect x="120.6" y="104.6" width="10.8" height="10.8" fill="#f6e7c1" /><rect x="108.6" y="104.6" width="10.8" height="10.8" fill="#f6e7c1" /><rect x="120.6" y="200.6" width="10.8" height="10.8" fill="#e9b65a" /><rect x="108.6" y="200.6" width="10.8" height="10.8" fill="#e9b65a" /><rect x="120.6" y="92.6" width="10.8" height="10.8" fill="#e9b65a" /><rect x="108.6" y="92.6" width="10.8" height="10.8" fill="#e9b65a" /><rect x="120.6" y="236.6" width="10.8" height="10.8" fill="#e0874c" /><rect x="108.6" y="236.6" width="10.8" height="10.8" fill="#e0874c" /><rect x="120.6" y="56.6" width="10.8" height="10.8" fill="#e0874c" /><rect x="108.6"