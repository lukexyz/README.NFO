<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Jukebox symbol</title><desc id="d">An arched navy jukebox with gold columns plays a record under its dome; below, a track list holds the selected album on a red bar. Primary brand colour #18223a, plain MediaLog wordmark. The chip-music jukebox screen becomes the cabinet itself: a dome, gold columns and a three-row track list with right-aligned times; A red selection bar and a red record label are the only strong colours against navy and gold.</desc><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0" ><stop offset="0" stop-color="#f6d48d"/><stop offset="0.5" stop-color="#d39a5c"/><stop offset="1" stop-color="#8a5a2c"/></linearGradient><linearGradient id="arch" x1="0" y1="0" x2="0" y2="1" ><stop offset="0" stop-color="#f6e3b8"/><stop offset="1" stop-color="#d39a5c"/></linearGradient><clipPath id="dome"><path d="M68 172V130A52 52 0 0 1 172 130V172Z"/></clipPath><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5" ><stop offset="0" stop-color="#f6d48d" stop-opacity="0.55"/><stop offset="1" stop-color="#f6d48d" stop-opacity="0"/></radialGradient></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><circle cx="120" cy="128" r="92" fill="url(#glow)" /><path d="M40 244V128A80 80 0 0 1 200 128V244Z" fill="var(--tile)" stroke="var(--rim)" stroke-width="3"/><path d="M48 236V128A72 72 0 0 1 192 128V236" fill="none" stroke="url(#arch)" stroke-width="7"/><rect x="40" y="128" width="14" height="116" fill="url(#gold)" /><rect x="186" y="128" width="14" height="116" fill="url(#gold)" /><rect x="44" y="140" width="6" height="92" fill="#fff" opacity=".25" rx="3"/><rect x="190" y="140" width="6" height="92" fill="#fff" opacity=".25" rx="3"/><path d="M68 172V130A52 52 0 0 1 172 130V172Z" fill="#26365c" /><g clip-path="url(#dome)"><circle cx="120" cy="140" r="40" fill="#0b0f1a" /><circle cx="120" cy="140" r="36" fill="none" stroke="#2b3550" stroke-width="1.6"/><circle cx="120" cy="140" r="31" fill="none" stroke="#2b3550" stroke-width="1.6"/><circle cx="120" cy="140" r="26" fill="none" stroke="#2b3550" stroke-width="1.6"/><circle cx="120" cy="140" r="21" fill="none" stroke="#2b3550" stroke-width="1.6"/><circle cx="120" cy="140" r="13" fill="#c4473d" /><circle cx="120" cy="140" r="3" fill="#f6f3eb" /><path d="M120 100A40 40 0 0 1 156 122L120 140Z" fill="#ffffff" opacity=".09"/></g><path d="M68 172V130A52 52 0 0 1 172 130V172Z" fill="none" stroke="#f6e3b8" stroke-width="4"/><rect x="64" y="178" width="112" height="40" fill="#0b0f1a" rx="5"/><rect x="72" y="184" width="58" height="5" fill="#9fb4d4" /><rect x="150" y="184" width="18" height="5" fill="#9fb4d4" /><rect x="68" y="195" width="104" height="11" fill="#c4473d" rx="2"/><rect x="72" y="198" width="64" height="5" fill="#f6f3eb" /><rect x="150" y="198" width="18" height="5" fill="#f6f3eb" /><rect x="72" y="211" width="46" height="5" fill="#6c84a8" /><rect x="150" y="211" width="18" height="5" fill="#6c84a8" /><rect x="72" y="226" width="7" height="12" fill="#0b0f1a" rx="2"/><rect x="86.5" y="226" width="7" height="12" fill="#0b0f1a" rx="2"/><rect x="101" y="226" width="7" height="12" fill="#0b0f1a" rx="2"/><rect x="115.5" y="226" width="7" height="12" fill="#0b0f1a" rx="2"/><rect x="130" y="226" width="7" height="12" fill="#0b0f1a" rx="2"/><rect x="144.5" y="226" width="7" height="12" fill="#0b0f1a" rx="2"/><rect x="159" y="226" width="7" height="12" fill="#0b0f1a" rx="2"/></svg>
