<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Stacked symbol</title><desc id="d">Three framed crack-screen panels become a stack of books — orange, blue and green covers with white titles that carry green and violet colour fringes — with an open book resting on top. Primary brand colour #18223a, plain MediaLog wordmark. The thick single-colour frames and white type of early hi-res title cards become book covers and spine titles; Colour fringes on every white edge mimic how hi-res white picks up green and violet; nothing is lettered.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M38 52H202A18 18 0 0 1 220 70V234A18 18 0 0 1 202 252H38A18 18 0 0 1 20 234V70A18 18 0 0 1 38 52Z" fill="#05060a" stroke="var(--rim)" stroke-width="3"/><g transform="rotate(0 120 223)" ><rect x="36" y="206" width="168" height="34" fill="#ff9933" rx="3"/><rect x="43" y="213" width="154" height="20" fill="#05060a" /><rect x="49.5" y="219.5" width="3.5" height="7" fill="#a65cff" /><rect x="149" y="219.5" width="3.5" height="7" fill="#3fd14f" /><rect x="53" y="219.5" width="96" height="7" fill="#ffffff" /><rect x="183" y="216" width="3.5" height="14" fill="#ff9933" opacity=".9"/></g><g transform="rotate(-2 121 189)" ><rect x="46" y="172" width="150" height="34" fill="#3d7bff" rx="3"/><rect x="53" y="179" width="136" height="20" fill="#05060a" /><rect x="59.5" y="185.5" width="3.5" height="7" fill="#a65cff" /><rect x="133" y="185.5" width="3.5" height="7" fill="#3fd14f" /><rect x="63" y="185.5" width="70" height="7" fill="#ffffff" /><rect x="175" y="182" width="3.5