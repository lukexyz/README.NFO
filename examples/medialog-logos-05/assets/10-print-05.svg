<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Review slip</title><desc id="d">A photocopied tick-box slip lists a book, a film and an album; the first two are ticked in red pen and the album is crossed out, above a dotted tear-off coupon. Primary brand colour #18223a, plain MediaLog wordmark. The swap-letter form becomes a media review card: one box per thing you read, watched or heard; Photocopier black on warm white, red pen marks, grain and a toner streak; no typed words are needed.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><g transform="rotate(-4 120 156)" ><path d="M54 68H202A6 6 0 0 1 208 74V252A6 6 0 0 1 202 258H54A6 6 0 0 1 48 252V74A6 6 0 0 1 54 68Z" fill="#18223a" opacity=".18"/><g ><path d="M46 60H194A6 6 0 0 1 200 66V244A6 6 0 0 1 194 250H46A6 6 0 0 1 40 244V66A6 6 0 0 1 46 60Z" fill="#fbfaf6" stroke="#18223a" stroke-opacity=".25" stroke-width="2"/><rect x="172" y="60" width="2" height="190" fill="#18223a" opacity=".06"/><path d="M180 60H200V80Z" fill="#e3dfd2" /><rect x="58" y="74" width="96" height="14" fill="#18223a" rx="3"/><path d="M58 97Q90 92 124 96" fill="none" stroke="#d8352a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="58" y="110" width="22" height="22" fill="none" stroke="#18223a" stroke-width="4"/><path d="M108 115Q101 110 92 112V129Q101 127 108 132Z" fill="#18223a" /><path d="M110 115Q117 110 126 112V129Q117 127 110 132Z" fill="#18223a" /><rect x="134" y="126" width="3" height="3" fill="#18223a" opacity=".55"/><rect x="141" y="126" width="3" height="3" fill="#18223a" opacity=".55"/><