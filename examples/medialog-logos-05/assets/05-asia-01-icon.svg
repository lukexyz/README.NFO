<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Channel keys symbol</title><desc id="d">A synth status screen in lavender on deep navy: spectrum bars with peak-hold ticks above a piano keyboard where one key is lit green. Primary brand colour #18223a, plain MediaLog wordmark. One keyboard strip, a sliced spectrum analyser and hairline frames keep the X68000 player look at icon size; The lit key is the only green on the screen, as on the original displays; tiny labels and counters are left out.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M32 62H208A16 16 0 0 1 224 78V216A16 16 0 0 1 208 232H32A16 16 0 0 1 16 216V78A16 16 0 0 1 32 62Z" fill="#101032" stroke="var(--rim)" stroke-width="3"/><path d="M34 70H206A10 10 0 0 1 216 80V214A10 10 0 0 1 206 224H34A10 10 0 0 1 24 214V80A10 10 0 0 1 34 70Z" fill="none" stroke="#8f8fff" stroke-opacity=".45" stroke-width="2"/><rect x="30" y="158" width="180" height="2" fill="#8f8fff" opacity=".45"/><path d="M206 70H216V80" fill="none" stroke="#8f8fff" stroke-width="2"/><rect x="36" y="144.2" width="12.4" height="5" fill="#8f8fff" /><rect x="36" y="136.8" width="12.4" height="5" fill="#8f8fff" /><rect x="36" y="129.4" width="12.4" height="5" fill="#8f8fff" /><rect x="36" y="122" width="12.4" height="5" fill="#8f8fff" /><rect x="36" y="114.6" width="12.4" height="5" fill="#8f8fff" opacity=".75"/><rect x="36" y="93.8" width="12.4" height="2.6" fill="#d4d4ff" /><rect x="50.2" y="144.2" width="12.4" height="5" fill="#8f8fff" /><rect x="50.2" y="136.8" width="12.4" height="5" fill="#8f8fff" /><rect x="50.2"