<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Off air symbol</title><desc id="d">A navy television with rabbit-ear antennas shows broadcast colour bars, castellations and a black-level strip, with a station-ident box holding a small open book. Primary brand colour #18223a, plain MediaLog wordmark. The colour-bar test pattern reads as television at any size; the ident box carries the diary as the channel logo; Bars are pulled toward ochre, teal, plum and brick so the screen stays clear of neon cyan and magenta.</desc><defs><clipPath id="crt"><path d="M52 100H160A16 16 0 0 1 176 116V202A16 16 0 0 1 160 218H52A16 16 0 0 1 36 202V116A16 16 0 0 1 52 100Z"/></clipPath><linearGradient id="sheen" x1="0" y1="0" x2="0.8" y2="1" ><stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M112 92L82 46" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M118 92L152 52" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="82" cy="46" r="6" fill="var(--accent)" /><circle cx="152" cy="52" r="6" fill="var(--accent)" /><path d="M98 94Q115 76 132 94Z" fill="var(--tile)" /><path d="M42 86H198A22 22 0 0 1 220 108V210A22 22 0 0 1 198 232H42A22 22 0 0 1 20 210V108A22 22 0 0 1 42 86Z" fill="var(--tile)" stroke="var(--rim)" stroke-width="3"/><rect x="30" y="232" width="22" height="10" fill="var(--tile)" rx="3"/><rect x="188" y="232" width