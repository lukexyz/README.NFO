<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Chrome edition symbol</title><desc id="d">An open book cast in megademo chrome — deep blue above a white horizon, cool grey below — over a drifting starfield, resting on a gold selection bar. Primary brand colour #18223a, plain MediaLog wordmark. The chrome logo treatment moves from the lettering to the symbol, so the wordmark stays plain; The menu’s selection bar becomes a gold shelf; three star layers drift at different speeds.</desc><defs><linearGradient id="chrome" x1="0" y1="84" x2="0" y2="210" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1c3a78"/><stop offset="0.3" stop-color="#5f8fd6"/><stop offset="0.5" stop-color="#d9e7fb"/><stop offset="0.53" stop-color="#ffffff"/><stop offset="0.555" stop-color="#28304a"/><stop offset="0.64" stop-color="#5d6782"/><stop offset="0.86" stop-color="#b9c1d1"/><stop offset="1" stop-color="#eef1f6"/></linearGradient><linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0" ><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="tile"><rect x="20" y="56" width="200" height="184" rx="18"/></clipPath><clipPath id="pages"><path d="M116 102Q84 84 40 92V196Q84 188 116 208Z"/><path d="M124 102Q156 84 200 92V196Q156 188 124 208Z"/></clipPath></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}.l1{animation:drift 30s linear infinite}.l2{animation:drift 18s linear infinite}.l3{animation:drift 10s linear infinite}.sweep rect{animation:sw