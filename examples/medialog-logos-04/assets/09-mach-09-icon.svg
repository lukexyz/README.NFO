<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Press start symbol</title><desc id="d">A tile-built gold star with a hard red shadow sits on a navy title card above a two-line menu and a blinking cursor: the rating you give, as a cartridge title screen. Primary brand colour #18223a, plain MediaLog wordmark. An 8-bit title-screen layout: one backdrop, chunky tile-aligned pixels, a hard drop shadow and a two-entry menu; Palette cycling makes the star’s centre shimmer without moving a pixel; no lettering is placed in the symbol.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}.cycle{animation:cycle 1.2s steps(1,end) infinite}.cycle rect{fill:inherit}.cycle{fill:#fff4cf}.blink{animation:blink 1.1s steps(1,end) infinite}*{animation:none!important;transition:none!important}</style><rect x="20" y="56" width="200" height="184" fill="var(--tile)" rx="18" stroke="var(--rim)" stroke-width="3"/><rect x="120" y="70" width="12" height="12" fill="#c4473d" /><rect x="108" y="82" width="12" height="12" fill="#c4473d" /><rect x="120" y="82" width="12" height="12" fill="#c4473d" /><rect x="132" y="82" width="12" height="12" fill="#c4473d" /><rect x="108" y="94" width="12" height="12" fill="#c4473d" /><rect x="120" y="94" width="12" height="12" fill="#c4473d" /><rect x="132" y="94" width="12" height="12" fill="#c4473d" /><rect x="60" y="106" width="12" height="12" fill="#c4473d" /><rect x="72" y="106" width="12" height="12" fill="#c4473d" /><rect x="84" y="106" width="12" height="12" fill="#c4473d" /><rect x="96" y="106" width="12" height="12" fill="#c4473d" /><rect x="108"