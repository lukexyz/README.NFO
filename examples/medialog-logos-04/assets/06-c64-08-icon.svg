<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Endless loop symbol</title><desc id="d">Twenty-two shaded spheres ride an endless figure-eight between two hairlines, larger as they swing nearer — a timeline that keeps going. Primary brand colour #18223a, plain MediaLog wordmark. The blitter-bob chain on a Lissajous path becomes a loop with no beginning or end; One navy ramp with a white highlight replaces the copper blue; the rainbow hairlines become steel and tan.</desc><defs><radialGradient id="bob" cx=".5" cy=".5" r=".5" fx=".34" fy=".3"><stop offset="0" style="stop-color:var(--b0)"/><stop offset=".22" style="stop-color:var(--b1)"/><stop offset=".7" style="stop-color:var(--b2)"/><stop offset="1" style="stop-color:var(--b3)"/></radialGradient><linearGradient id="hair" x1="0" y1="0" x2="1" y2="0" ><stop offset="0" stop-color="#74889a" stop-opacity="0"/><stop offset="0.2" stop-color="#74889a"/><stop offset="0.5" stop-color="#ae8660"/><stop offset="0.8" stop-color="#74889a"/><stop offset="1" stop-color="#74889a" stop-opacity="0"/></linearGradient></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}:root{--b0:#ffffff;--b1:#9fb4d4;--b2:#2c3f66;--b3:#0f1729}@media(prefers-color-scheme:dark){:root{--b0:#ffffff;--b1:#c9d8ef;--b2:#5b76a8;--b3:#24355a}}*{animation:none!important;transition:none!important}</style><rect x="16" y="78" width="208" height="4" fill="url(#hair)" /><rect x="16" y="216" width="208" height="4" fill="url(#hair)" /><g ><circle cx="30.92" cy="160.96" r="7.94" fill="url(#bob)"></circle><circle cx="30.92" cy="135.04" r="7.94" fill="url(#bob)"></circle><circle