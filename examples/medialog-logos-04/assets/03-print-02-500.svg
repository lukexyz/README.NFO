<svg xmlns="http://www.w3.org/2000/svg" width="500" height="182" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Side A</title><desc id="d">A navy cassette with an obi-strip label ruled like a diary page; the reels keep turning and the tape slowly winds from one side to the other. Primary brand colour #18223a, plain MediaLog wordmark. The netlabel J-card becomes a cream label with a signal-red obi strip and a drawn side-A mark; Ruled label lines and a tan underline make the tape a mixtape journal, not a music-only mark.</desc><defs><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1" ><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}.reel{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}.fast{animation-duration:2.4s}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><path d="M30 80H210A14 14 0 0 1 224 94V204A14 14 0 0 1 210 218H30A14 14 0 0 1 16 204V94A14 14 0 0 1 30 80Z" fill="var(--tile)" stroke="var(--rim)" stroke-width="3"/><path d="M62 218L72 194H168L178 218Z" fill="#26345a" /><circle cx="98" cy="207" r="4.5" fill="#0c1222" /><circle cx="142" cy="207" r="4.5" fill="#0c1222" /><circle cx="28" cy="92" r="3.4" fill="#3d4c72" /><circle cx="212" cy="92" r="3.4" fill="#3d4c72" /><circle cx="28" cy="206" r="3.4" fill="#3d4c72" /><circle cx="212" cy="206" r="3.4" fill="#3d4c72" /><rect x="30" y="92" width="180" height