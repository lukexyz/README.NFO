<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Glass book symbol</title><desc id="d">A translucent open book turns slowly in space. Where its pages overlap, the glass deepens, like a glenz object from a nineties demo. Primary brand colour #18223a, plain MediaLog wordmark. The rotating glenz solid becomes a six-leaf open book with a tan ribbon, projected in true perspective; Translucent navy faces deepen where they overlap on light pages; on dark pages they brighten like glass.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}:root{--glass:rgba(58,90,140,.2);--glass2:rgba(24,34,58,.42);--edge:#18223a;--lines:#5f7899;--spark:#ae8660}@media(prefers-color-scheme:dark){:root{--glass:rgba(214,228,255,.16);--glass2:rgba(150,178,222,.32);--edge:#e9eef7;--lines:#a9bede;--spark:#d0ac85}}.spark{transform-box:fill-box;transform-origin:center;animation:spark 4.6s ease-in-out infinite}.s2{animation-delay:-2.3s}*{animation:none!important;transition:none!important}</style><ellipse cx="120" cy="196" rx="86" ry="12" fill="var(--ink)" opacity=".08"/><g class="obj"><path d="M135.88 99.18L106.63 192.79L185.66 203.69L227.88 115.97Z" fill="var(--glass2)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"></path><path d="M135.88 99.18L106.63 192.79L23.17 174.97L37.11 75.56Z" fill="var(--glass2)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"></path><path d="M134.66 103.07L107.5 190L179.78 191.83L216.97 110.64Z" fill="var(--glass)" stroke="var(--edge)" stroke-width="2.4" stroke-linejoin="round"></path><path d="M134.66 103.07L107.5 190L32.12 165.15L46.17