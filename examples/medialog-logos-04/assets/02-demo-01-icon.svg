<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Opening titles symbol</title><desc id="d">A letterboxed horizon fades up from black and pans in three parallax layers under a low warm sun, like the first part of a PC demo. Primary brand colour #18223a, plain MediaLog wordmark. Letterbox bars, a palette fade and a slow sideways pan carry the opening-titles grammar into a single frame; Steel-blue VGA ranges are pulled toward the brand navy; one warm sun is the only accent.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1" ><stop offset="0" stop-color="#141d36"/><stop offset="0.55" stop-color="#3b4777"/><stop offset="1" stop-color="#a9a6cf"/></linearGradient><radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f3d9a8"/><stop offset=".55" stop-color="#e2a86a" stop-opacity=".55"/><stop offset="1" stop-color="#e2a86a" stop-opacity="0"/></radialGradient><clipPath id="band"><rect x="16" y="90" width="208" height="116"/></clipPath><clipPath id="tile"><rect x="16" y="66" width="208" height="164" rx="16"/></clipPath></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}.far{animation:pan 36s linear infinite}.mid{animation:pan 22s linear infinite}.near{animation:pan 13s linear infinite}.fade{animation:fade 1.6s ease-out both}.tw{animation:tw 3.2s ease-in-out infinite}.tw:nth-child(2n){animation-delay:-1.1s}.tw:nth-child(3n){animation-delay:-2.3s}*{animation:none!important;transition:none!important}</style><g clip-path="url(#tile)"><rect x="16" y="66" width="208" height="164" fill="#0c1222" /><g clip-path="url(#band)"><rect x="16" y="90" width="2