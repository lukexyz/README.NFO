<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — System diary symbol</title><desc id="d">A one-bit window with a pinstriped title bar and a hard drop shadow holds an open diary; one page is checkerboard grey and an arrow pointer reaches in. Primary brand colour #18223a, plain MediaLog wordmark. Desktop-era one-bit rules: pinstripe title bar, close box, hard shadow and dithered grey, aligned to whole pixels; Black and white become brand navy and warm paper; a tan ribbon is the only extra colour.</desc><defs><pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f6f3eb"/><rect width="4" height="4" fill="#18223a"/><rect x="4" y="4" width="4" height="4" fill="#18223a"/></pattern></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}:root{--shadow:#18223a}@media(prefers-color-scheme:dark){:root{--shadow:#5d6f88}}.cursor{animation:nudge 5s ease-in-out infinite}*{animation:none!important;transition:none!important}</style><rect x="34" y="70" width="172" height="160" fill="var(--shadow)" /><rect x="24" y="60" width="172" height="160" fill="#f6f3eb" stroke="#18223a" stroke-width="4"/><rect x="30" y="66" width="160" height="3" fill="#18223a" /><rect x="30" y="72" width="160" height="3" fill="#18223a" /><rect x="30" y="78" width="160" height="3" fill="#18223a" /><rect x="36" y="64" width="28" height="20" fill="#f6f3eb" /><rect x="40" y="66" width="16" height="16" fill="#f6f3eb" stroke="#18223a" stroke-width="4"/><rect x="84" y="64" width="52" height="20" fill="#f6f3eb" /><rect x="24" y="88" width="172" height="4" fill="#18223a" /><path d="M44 112Q74 102 108 114V198Q76 186 44 196Z" fill="url(#dither)" /><path d="M44 112Q74 102 108 114V198Q76 186 44 196Z" fill="none" stroke="#18223a" stroke-width="6" stroke-linejoin="round"/><path d="M108 114Q142 102 176 112V196Q144 186 108 198Z" fill="#f6f3eb" stroke="#18223a" stroke-width="6" stroke-linejoin="round"/><rect x="120" y="128" width="44" height="5" fill="#18223a" /><rect x="120" y="144" width="44" height="5" fill="#18223a" /><rect x="120" y="160" width="30" height="5" fill="#18223a" /><path d="M42 202Q76 192 108 206Q140 192 178 202" fill="none" stroke="#18223a" stroke-width="6" stroke-linecap="round"/><rect x="156" y="104" width="10" height="30" fill="var(--accent)" /><path d="M156 134L161 128L166 134Z" fill="#f6f3eb" /><g transform="translate(178 176)" class="cursor"><path d="M0 0V52L12 40L22 62L32 57L22 36H39Z" fill="#f6f3eb" stroke="#18223a" stroke-width="4" stroke-linejoin="miter"/></g></svg>
