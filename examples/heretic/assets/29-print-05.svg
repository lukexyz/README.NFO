w AGPL-3.0</text><rect x="504" y="273" width="18" height="18" fill="none" stroke="#303030"/><text x="535" y="288" font-family="Consolas,monospace" font-size="19" fill="#222" >Original header artwork</text><path d="M45 324H916" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="5 5"/><text x="64" y="351" font-family="Consolas,monospace" font-size="17" fill="#222" >REPLY COUPON / YOUR FAVOURITE DIRECTION: __________________</text><text x="64" y="375" font-family="Consolas,monospace" font-size="13" fill="#555" >Illustrative paperwork, not a completed research checklist.</text></svg>
