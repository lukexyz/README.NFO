<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">heretic — Scene paperwork: tick-box swap letter, party pre-invitation with reply coupon, hand-drawn votesheet</title><desc id="desc">A photocopied swap letter with red pen ticks, a research checklist and a tear-off direction coupon. Fully automatic censorship removal for language models</desc><defs></defs><style>
