<title id="t">MediaLog: each kind has its colour</title><desc id="d">Each kind has its colour, and in the banner each verb lights up its own kinds. Watched: movies (red), TV shows and anime (blue), videos (plum). Read: books (amber), comics and manga (magenta). Played: games (green). Listened to: podcasts (violet), music (teal). Every kind is shown as a ramp of the six shades the banner lights it with.</desc>
