<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Now reading symbol</title><desc id="d">An open book with smoked-glass pages, its lines of text drawn as rows of hexagonal fluorescent segments: lit teal up to the reading position halfway down the right page and faintly visible beyond it, with an orange bookmark annunciator. Primary brand colour #18223a, plain MediaLog wordmark. The display’s ghosted unlit segments become the unread part of the page, so the book shows how far you have got; One orange annunciator, a bookmark, is the only second colour; no digits or lettering.</desc><defs><linearGradient id="glass" x1="0" y1="0" x2="0.5" y2="1" ><stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/></linearGradient><filter id="vfd" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M120 110Q80 92 24 102V214Q80 206 120 224Q160 206 216 214V102Q160 92 120 110Z" fill="var(--rim)" /><path d="M116,104Q80,86 30,96L30,206Q80,196 116,214Z" fill="#071416" /><path d="M124,104Q160,86 210,96L210,206Q160,196 124,214Z" fill="#071416" /><g opacity=".1"><path d="M111.39 123.46L106.94 125.63L97.49 122.37L95.32 117.92L99.77 115.75L109.22 119.01Z" fill="#8ff5dc" /><path d="M94.17 117.65L90.13 120.51L80.27 118.83L77.41 114.79L81.45 111.93L91.31 113.61Z" fill="#8ff5dc" /><path d="M75.37 114.63L71.8 118.06L61.8 117.85L58.37 114.28L61.94 110.86L71