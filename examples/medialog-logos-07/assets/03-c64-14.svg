<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Chapter select</title><desc id="d">An open book with embossed grey metal pages on a brown-and-gold binding: the right page is a track list of chapters in green and blue with times set right and the selected one on a red bar, and the left page has a raised title plate over a strip of rainbow blocks. Primary brand colour #18223a, plain MediaLog wordmark. The music disk’s menu of tunes becomes a contents page, so choosing a chapter looks like choosing a tune; Embossed grey, a red selection bar and a rainbow strip carry the 16-bit jukebox; the binding takes the brown and gold of the drawn cabinet.</desc><defs><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e5ea"/><stop offset="1" stop-color="#c3c7cf"/></linearGradient></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M120 104L24 96V212L120 222L216 212V96Z" fill="#6b4424" stroke="#2a1a0e" stroke-width="3" stroke-linejoin="round"/><path d="M27 99V209M213 99V209" fill="none" stroke="#d9a54e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M117 98L30 90L30 202L117 212Z" fill="url(#metal)" /><path d="M123 98L210 90L210 202L123 212Z" fill="url(#metal)" /><path d="M117,212L117,98L30,90" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M30,90L30,202L117,212" fill="none" stroke="#6f7584" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M123,212L123,98L210,90" fill="none" stroke="#ffffff" stroke-width="3" strok