<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Title card symbol</title><desc id="d">A hardback whose cover is an early home-computer title card: black inside a thick orange frame banded on the spine side, a title of three chunky blocks in green, violet and blue, and white credit lines fringed violet on one side and green on the other, with a green ribbon and the page block’s white edge fringed the same way. Primary brand colour #18223a, plain MediaLog wordmark. The crack screen’s framed panel and multicoloured block title become a book cover, with credits in place of any group name; Colour fringes on every white edge mimic how hi-res white picks up green and violet; nothing is lettered.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><g transform="rotate(-5 119 141)" ><path d="M80 57H179A5 5 0 0 1 184 62V202A5 5 0 0 1 179 207H80A2 2 0 0 1 78 205V59A2 2 0 0 1 80 57Z" fill="var(--rim)" /><rect x="168" y="61" width="13" height="142" fill="#ffffff" /><path d="M173 80H181M173 94H181M173 108H181M173 122H181M173 136H181M173 150H181M173 164H181M173 178H181M173 192H181" fill="none" stroke="#c9c9d2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="181" y="61" width="3.5" height="142" fill="#3fd14f" /><rect x="78" y="61" width="90" height="5" fill="#ffffff" /><rect x="74.5" y="61" width="3.5" height="5" fill="#a65cff" /><path d="M142 212H150V236L146 232L142 236Z" fill="#3fd14f" /><rect x="66" y="66" width="106" height="150" fill="#ff9933" rx="3"/><rect x="86" y="76" width="76" height="130" fill="#05060a" /><rect x="71" y="82" width="10" height="3" fill="#05060a" /><rect x="71" y="197" width="10" height="3" fill="#05060a" /><rect x="82" y="66" width="2" height="150" fill="#000000" opacity=".3"/><rect x="94" y="100" width="16" height="26" fill="#3fd14f" /><rect x="114" y="100" width="16" height="26" fill="#a65cff" /><rect x="134" y="100" width="16" height="26" fill="#3d7bff" /><rect x="92.5" y="146" width="3.5" height="7" fill="#a65cff" /><rect x="152" y="146" width="3.5" height="7" fill="#3fd14f" /><rect x="96" y="146" width="56" height="7" fill="#ffffff" /><rect x="99.5" y="161" width="3.5" height="7" fill="#a65cff" /><rect x="145" y="161" width="3.5" height="7" fill="#3fd14f" /><rect x="103" y="161" width="42" height="7" fill="#ffffff" /></g></svg>
