<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Book swap symbol</title><desc id="d">A blue cloth hardback with a photocopied tick-box slip sticking out of the top as a bookmark: a marker-drawn header bar and two boxes ticked in red pen beside dotted lines, with a little photocopier grain. Primary brand colour #18223a, plain MediaLog wordmark. The swap letter that travelled with every disk becomes the note tucked into a lent book: what you thought of it, in tick boxes; Photocopier black on warm white and red pen on the slip; the book is plain cloth with a stamped panel, and no words are typed.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M69 122H184A6 6 0 0 1 190 128V230A6 6 0 0 1 184 236H69A3 3 0 0 1 66 233V125A3 3 0 0 1 69 122Z" fill="var(--rim)" /><path d="M65 125H180A5 5 0 0 1 185 130V230A5 5 0 0 1 180 235H65A2 2 0 0 1 63 233V127A2 2 0 0 1 65 125Z" fill="#f6f3eb" stroke="var(--rim)" stroke-width="2.5"/><path d="M184 134V230" fill="none" stroke="#c9c1ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><g transform="rotate(6 137 112)" ><path d="M101 52H173A3 3 0 0 1 176 55V169A3 3 0 0 1 173 172H101A3 3 0 0 1 98 169V55A3 3 0 0 1 101 52Z" fill="#fbfaf6" stroke="#18223a" stroke-opacity=".35" stroke-width="2"/><rect x="108" y="61" width="44" height="9" fill="#18223a" rx="2"/><path d="M108 76Q126 73 146 75" fill="none" stroke="#d8352a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="108" y="84" width="15" height="15" fill="none" stroke="#18223a" stroke-width="3.5"/><rect x="130" y="93" width