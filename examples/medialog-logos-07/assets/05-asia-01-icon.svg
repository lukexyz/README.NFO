<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Three channels symbol</title><desc id="d">A stack of three books with plum, violet and lavender covers lies with rounded spines to the left, and the edge of each page block is a miniature piano keyboard with one key lit lime, climbing from book to book like a chord. Primary brand colour #18223a, plain MediaLog wordmark. The synth player’s one-keyboard-per-channel strips become a stack of books: white pages read as white keys; Lavender, violet and plum on the covers; lime only on the sounding keys, as on the original displays.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M39 178H205Q208 178 208 181V223Q208 226 205 226H39A13 24 0 0 1 39 178Z" fill="#3b2f6b" /><rect x="39" y="187" width="163" height="30" fill="#ecebf2" /><rect x="53.02" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="68.64" y="187" width="14.82" height="30" fill="#86f53a" /><rect x="67.84" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="82.65" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="97.47" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="112.29" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="127.11" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="141.93" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="156.75" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="171.56" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="186.38" y="187" width="1.6" height="30" fill="#8a8aa6" /><rect x="49.37" y="187" width="8.89" height="17.4" fill="#101