<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Test card symbol</title><desc id="d">A hardback standing in three-quarter view whose cover is a broadcast test pattern: seven colour bars over a strip of castellations and a black-level band with its white square, its cream page edges turned toward you. Primary brand colour #18223a, plain MediaLog wordmark. The colour bars that fill the screen after closedown fill a book cover instead, so the symbol is a book first and television second; Bars are pulled toward ochre, teal, plum and brick to keep clear of neon cyan and magenta; no station box or lettering.</desc><defs><clipPath id="cover"><path d="M50 72L154 92L154 242L50 222Z"/></clipPath></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M154 92L184 78L184 228L154 242Z" fill="var(--rim)" stroke="var(--rim)" stroke-width="3.5" stroke-linejoin="round"/><path d="M158.8 94.76L179.2 85.24L179.2 225.24L158.8 234.76Z" fill="#f6f3eb" /><path d="M160,111.2L178,102.8M160,127.2L178,118.8M160,143.2L178,134.8M160,159.2L178,150.8M160,175.2L178,166.8M160,191.2L178,182.8M160,207.2L178,198.8M160,223.2L178,214.8" fill="none" stroke="#c9c1ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 72L154 92L184 78L80 58Z" fill="var(--rim)" stroke="var(--rim)" stroke-width="3.5" stroke-linejoin="round"/><path d="M60 70.76L154.64 88.96L175.04 79.44L80.4 61.24Z" fill="#f6f3eb" /><g clip-path="url(#cover)"><g transform="matrix(0.93 0.18 0 0.9 50 72)" ><rect x="0" y="0" width="16.4" height="99.6" fill="#c9c6bd" /><rect x="16" y="0" width="16.4" height="99.6" fill="#d8b450" /><rect x="32" y="0" width="16.4" height="99.6" fill="#5fae9f" /><rect x="48" y="0" width="16.4" height="99.6" fill="#67a157" /><rect x="64" y="0" width="16.4" height="99.6" fill="#93608c" /><rect x="80" y="0" width="16.4" height="99.6" fill="#c4473d" /><rect x="96" y="0" width="16.4" height="99.6" fill="#3d5fae" /><rect x="0" y="99.6" width="16.4" height="13.28" fill="#3d5fae" /><rect x="16" y="99.6" width="16.4" height="13.28" fill="#10141f" /><rect x="32" y="99.6" width="16.4" height="13.28" fill="#93608c" /><rect x="48" y="99.6" width="16.4" height="13.28" fill="#10141f" /><rect x="64" y="99.6" width="16.4" height="13.28" fill="#5fae9f" /><rect x="80" y="99.6" width="16.4" height="13.28" fill="#10141f" /><rect x="96" y="99.6" width="16.4" height="13.28" fill="#c9c6bd" /><rect x="0" y="112.88" width="112" height="53.12" fill="#0c0f18" /><rect x="0" y="112.88" width="20" height="53.12" fill="#1d2c55" /><rect x="20" y="112.88" width="20" height="53.12" fill="#f6f3eb" /><rect x="40" y="112.88" width="20" height="53.12" fill="#3b2a5c" /><rect x="80" y="112.88" width="5.28" height="53.12" fill="#05070c" /><rect x="90.56" y="112.88" width="5.28" height="53.12" fill="#1a2030" /></g></g><path d="M58.84,73.7L58.84,223.7" fill="none" stroke="#05070c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4"/><path d="M50 72L154 92L154 242L50 222Z" fill="none" stroke="var(--rim)" stroke-width="3.5" stroke-linejoin="round"/></svg>
