<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Colour clash symbol</title><desc id="d">An open book in 8-bit pixel art on an attribute grid, one ink and one paper to each 8 × 8 cell: yellow pages with black lines of text on a blue cover, and a red ribbon whose cells turn the text beside it red; the cells either side of the gutter lose their bright bit, shading the pages in blocks. Primary brand colour #18223a, plain MediaLog wordmark. Colour set per cell, not per pixel, so the ribbon clashes with the text it crosses, as sprites did on the hardware; No border, plasma or tile: the book stands alone, one screen pixel to each art pixel at 203 × 74.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><g shape-rendering="crispEdges"><rect x="44" y="68" width="12" height="4" fill="#ffd93b" /><rect x="32" y="72" width="24" height="4" fill="#ffd93b" /><rect x="24" y="76" width="32" height="4" fill="#ffd93b" /><rect x="24" y="80" width="32" height="4" fill="#ffd93b" /><rect x="24" y="84" width="32" height="4" fill="#ffd93b" /><rect x="24" y="88" width="32" height="4" fill="#ffd93b" /><rect x="56" y="68" width="16" height="4" fill="#ffd93b" /><rect x="56" y="72" width="24" height="4" fill="#ffd93b" /><rect x="56" y="76" width="32" height="4" fill="#ffd93b" /><rect x="56" y="80" width="32" height="4" fill="#ffd93b" /><rect x="56" y="84" width="32" height="4" fill="#ffd93b" /><rect x="56" y="88" width="32" height="4" fill="#ffd93b" /><rect x="88" y="80" width="4" height="4" fill="#d6ad1f" /><rect x="88" y="84" width="12" height="4" fill="#d6ad1f" /><rect x="88" 