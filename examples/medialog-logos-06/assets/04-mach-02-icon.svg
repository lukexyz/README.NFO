<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Insert book symbol</title><desc id="d">The Kickstart insert-disk hand, white with a hard black outline, holds up a periwinkle hardback instead of a floppy; a grey metal title plate with a dark slot stands in for the disk shutter. Primary brand colour #18223a, plain MediaLog wordmark. The 1.x insert-disk card: flat white, periwinkle and grey with one-weight black outlines; The book replaces the disk, so the old prompt becomes an invitation to log what you are reading.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M150 254L132 228Q122 210 124 192L132 150L176 128L204 150Q212 166 206 184L196 206Q190 222 200 240L204 254Z" fill="#ffffff" stroke="#000022" stroke-width="5" stroke-linejoin="round"/><g transform="rotate(-12 100 116)" ><path d="M60 64L168 64L168 194L60 194Z" fill="#ffffff" stroke="#000022" stroke-width="5" stroke-linejoin="round"/><path d="M158 72V186M163 74V188M66 188H160" fill="none" stroke="#000022" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><path d="M48 52L152 52L152 182L48 182Z" fill="#7a7ad2" stroke="#000022" stroke-width="5" stroke-linejoin="round"/><rect x="48" y="52" width="16" height="130" fill="#5c5cb4" /><path d="M64 54V180" fill="none" stroke="#000022" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M80 72L134 72L134 104L80 104Z" fill="#b4b4c2" stroke="#000022" stroke-width="5" stroke-linejoin="round"/><rect x="100" y="79" width="12" height="18" fill="#5a5a78" /><path d="M48 52L152 52L152 182L48 182Z" fill=