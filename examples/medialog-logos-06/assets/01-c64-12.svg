<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Chrome hardback</title><desc id="d">A hardback in 16-bit chrome: the cover is filled with banded sky blues above a hard zigzag horizon and warm oranges below, with a dark outline, a light bevel edge, a cream page block for its extruded side and a white sparkle on the corner. Primary brand colour #18223a, plain MediaLog wordmark. The chrome logo’s banded fill, horizon, outline, bevel and extrusion are applied to a single book instead of lettering; No tile or border: the book stands on its own beside the wordmark.</desc><defs><clipPath id="cover"><path d="M54 58H166A8 8 0 0 1 174 66V220A8 8 0 0 1 166 228H54A4 4 0 0 1 50 224V62A4 4 0 0 1 54 58Z"/></clipPath><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1" ><stop offset="0" stop-color="#1c2c74"/><stop offset="0.16666666666666666" stop-color="#1c2c74"/><stop offset="0.16666666666666666" stop-color="#2f4cae"/><stop offset="0.3333333333333333" stop-color="#2f4cae"/><stop offset="0.3333333333333333" stop-color="#5878d8"/><stop offset="0.5" stop-color="#5878d8"/><stop offset="0.5" stop-color="#8eaaf0"/><stop offset="0.6666666666666666" stop-color="#8eaaf0"/><stop offset="0.6666666666666666" stop-color="#c6d8fb"/><stop offset="0.8333333333333334" stop-color="#c6d8fb"/><stop offset="0.8333333333333334" stop-color="#f2f7ff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient><linearGradient id="ground" x1="0" y1="0" x2="0" y2="1" ><stop offset="0" stop-color="#3b1208"/><stop offset="0.16666666666666666" stop-color="#3b1208"/><stop offset="0.16666666666666666" stop-color="#74270b"/><stop offset="0.3333333333333333" stop-color="#74270b"/><stop offset="0.3333333333333333" stop-color="#b4481a"/><stop offset="0.5" stop-color="#b4481a"/><stop offset="0.5" stop-color="#e57a2a"/><stop offset="0.66666