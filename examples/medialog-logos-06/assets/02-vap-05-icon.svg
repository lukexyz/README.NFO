<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Sunset chapter symbol</title><desc id="d">A slatted synthwave sun, yellow to orange to red, sinks into the gutter of an open book whose night-blue pages carry the violet laser grid. Primary brand colour #18223a, plain MediaLog wordmark. The outrun horizon becomes the top edge of the pages, and the floor grid recedes toward the gutter; No sky, palm trees or chrome lettering: just the sun and the book.</desc><defs><linearGradient id="sun" x1="0" y1="72" x2="0" y2="164" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe36e"/><stop offset="0.38" stop-color="#ffb547"/><stop offset="0.72" stop-color="#ff7a3a"/><stop offset="1" stop-color="#f0473f"/></linearGradient><clipPath id="sky"><rect x="0" y="0" width="240" height="170"/></clipPath><mask id="slats"><rect x="0" y="0" width="240" height="300" fill="#fff"/><rect x="30" y="103" width="180" height="2.5" fill="#000" /><rect x="30" y="115" width="180" height="4" fill="#000" /><rect x="30" y="126" width="180" height="5.5" fill="#000" /><rect x="30" y="137" width="180" height="7" fill="#000" /><rect x="30" y="148" width="180" height="8.5" fill="#000" /></mask><clipPath id="pages"><path d="M120 160Q70 122 24 136V212Q70 200 120 234Z"/><path d="M120 160Q170 122 216 136V212Q170 200 120 234Z"/></clipPath></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><g clip-path="url(#sky)"><g mask="url(#slats)"><circle cx="120" cy="152" r="80" fill="url(#sun)"/></g></g><path d="M120 160Q70 122 24 136V212Q70 200 120 234Z" fill="#1b1a3c" /><path d="M120 160Q170 122 216 136V212