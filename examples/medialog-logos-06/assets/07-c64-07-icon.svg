<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Copper shelf symbol</title><desc id="d">A row of book spines drawn as Kefrens copper bars: each spine shaded in hard bands, dark at the edges and bright in the centre, in red-gold, blue and violet ramps, with the last book leaning in whole-pixel steps. Primary brand colour #18223a, plain MediaLog wordmark. Vertical copper bars with stepped ramps, overlapping as later bars do, become spines with a few dark bands; No big scroller and no black backdrop: just the shelf.</desc><defs><linearGradient id="warm" x1="0" y1="0" x2="1" y2="0" ><stop offset="0" stop-color="#3a0b06"/><stop offset="0.09" stop-color="#3a0b06"/><stop offset="0.09" stop-color="#7d1d0b"/><stop offset="0.18" stop-color="#7d1d0b"/><stop offset="0.18" stop-color="#c4430f"/><stop offset="0.27" stop-color="#c4430f"/><stop offset="0.27" stop-color="#f08c26"/><stop offset="0.36" stop-color="#f08c26"/><stop offset="0.36" stop-color="#ffd46c"/><stop offset="0.45" stop-color="#ffd46c"/><stop offset="0.45" stop-color="#fff4c8"/><stop offset="0.55" stop-color="#fff4c8"/><stop offset="0.55" stop-color="#ffd46c"/><stop offset="0.64" stop-color="#ffd46c"/><stop offset="0.64" stop-color="#f08c26"/><stop offset="0.73" stop-color="#f08c26"/><stop offset="0.73" stop-color="#c4430f"/><stop offset="0.82" stop-color="#c4430f"/><stop offset="0.82" stop-color="#7d1d0b"/><stop offset="0.91" stop-color="#7d1d0b"/><stop offset="0.91" stop-color="#3a0b06"/><stop offset="1" stop-color="#3a0b06"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="0" ><stop offset="0" stop-color="#071436"/><stop offset="0.09" stop-color="#071436"/><stop offset="0.09" stop-color="#123a8a"/><stop offset="0.18" stop-color="#123a8a"/><stop offset="0.18" stop-color="#1f6fd0"/><stop offset="0.27" stop-color="#1