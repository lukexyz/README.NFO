<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Paperback party symbol</title><desc id="d">A flat yellow paperback in thick black outline with a black-and-white striped spine, a red quarter-circle on its cover and a hard offset shadow, set off-grid against a cobalt circle, a red squiggle and a mint triangle. Primary brand colour #18223a, plain MediaLog wordmark. Memphis: flat clashing colour, stripes against saturated fills, primitive shapes off-grid and solid offset shadows, with no gradients or perspective; The scatter is kept to three shapes so the book stays the subject.</desc><defs><clipPath id="spine"><rect x="62" y="66" width="26" height="154"/></clipPath><clipPath id="cover"><path d="M62 66H166V220H62Z"/></clipPath></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}.shade{fill:#111111}@media(prefers-color-scheme:dark){.shade{fill:#f6f3eb}}</style><circle cx="166" cy="92" r="38" fill="#2f5bd3" /><g transform="rotate(-7 114 143)" ><path d="M74 78H184V232H74Z" fill="" class="shade"/><path d="M70 72H176V214H70Z" fill="#ffffff" stroke="#111111" stroke-width="5" stroke-linejoin="round"/><path d="M170 84V202" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M62 66H166V220H62Z" fill="#ffd23f" stroke="#111111" stroke-width="5" stroke-linejoin="round"/><g clip-path="url(#spine)"><rect x="62" y="66" width="26" height="154" fill="#ffffff" /><path d="M52 -18L102 10" fill="none" stroke="#111111" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M52 -4L102 24" fill="none" stroke="#111111" stro