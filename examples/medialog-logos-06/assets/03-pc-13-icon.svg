<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Glass pages symbol</title><desc id="d">An open book lies on its back in glenz glass: blue covers, pale page blocks and one violet page in mid-turn, each a flat translucent pane that deepens where it overlaps another. Primary brand colour #18223a, plain MediaLog wordmark. Glenz vectors: flat translucent faces in one tint plus a pale partner, with crisp edges, from a single 3D pose; One object, no turntable, floor or frame.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}.cover{fill:#3263e0;fill-opacity:.72}.page{fill:#dde7ff;fill-opacity:.86}.turn{fill:#6a4fe6;fill-opacity:.6}.edge{stroke:#1f3a8f}@media(prefers-color-scheme:dark){.cover{fill:#5d8cff;fill-opacity:.5}.page{fill:#dce8ff;fill-opacity:.45}.turn{fill:#a58fff;fill-opacity:.5}.edge{stroke:#eef3ff}}</style><path d="M162.9 131.17L77.1 182.96L19.33 130.16L105.13 78.37Z" fill="" class="cover"/><path d="M162.9 131.17L77.1 182.96L134.87 229.21L220.67 177.42Z" fill="" class="cover"/><path d="M162.9 131.17L77.1 182.96L23.29 126.58L109.09 74.79Z" fill="" class="page"/><path d="M162.9 131.17L77.1 182.96L130.91 218.83L216.71 167.04Z" fill="" class="page"/><path d="M162.9 131.17L77.1 182.96L82.68 130.4L168.48 78.61Z" fill="" class="turn"/><path d="M162.9 131.17L77.1 182.96L19.33 130.16L105.13 78.37Z" fill="none" class="edge" stroke-width="4" stroke-linejoin="round"/><path d="M162.9 131.17L77.1 182.96L134.87 229.21L220.67 177.42Z" fill="none" class="edge" stroke-width="4" stroke-linejoin="round"/><path d="M162.9 131.17L77.1 182.96L23.29 126.58L109.09 74.79Z" fil