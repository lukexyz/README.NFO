<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Read me symbol</title><desc id="d">An open book as a 1-bit Kare-style icon: black outlines on white pages, words as runs of black pixels, checker-dithered grey for the cover, a hard black drop shadow and the arrow pointer resting on a page. Primary brand colour #18223a, plain MediaLog wordmark. Black and white only: every grey is a dither, and the shadow is a hard offset with no blur; Each icon pixel is exactly two screen pixels at the native 203 × 74 size, so the bitmap stays crisp.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M40 100h8v8h-8zM208 100h8v8h-8zM40 108h8v8h-8zM208 108h8v8h-8zM40 116h8v8h-8zM208 116h8v8h-8zM40 124h8v8h-8zM208 124h8v8h-8zM40 132h8v8h-8zM208 132h8v8h-8zM40 140h8v8h-8zM208 140h8v8h-8zM40 148h8v8h-8zM208 148h8v8h-8zM40 156h8v8h-8zM208 156h8v8h-8zM40 164h8v8h-8zM208 164h8v8h-8zM40 172h8v8h-8zM208 172h8v8h-8zM40 180h8v8h-8zM208 180h8v8h-8zM40 188h8v8h-8zM208 188h8v8h-8zM40 196h8v8h-8zM208 196h8v8h-8zM40 204h8v8h-8zM208 204h8v8h-8zM40 212h8v8h-8zM208 212h8v8h-8zM48 92h8v8h-8zM200 92h8v8h-8zM48 100h8v8h-8zM200 100h8v8h-8zM48 108h8v8h-8zM200 108h8v8h-8zM48 116h8v8h-8zM200 116h8v8h-8zM48 124h8v8h-8zM200 124h8v8h-8zM48 132h8v8h-8zM200 132h8v8h-8zM48 140h8v8h-8zM200 140h8v8h-8zM48 148h8v8h-8zM200 148h8v8h-8zM48 156h8v8h-8zM200 156h8v8h-8zM48 164h8v8h-8zM200 164h8v8h-8zM48 172h8v8h-8zM200 172h8v8h-8zM48 180h8v8h-8zM200 180h8v8h-8zM48 188h8v8h-8zM200 188h8v8h-8zM48 196h8v8h-8zM200 196h8v8h-8zM48 204h8v8h-8zM200 204h8v8h-8zM48 212h8v8h-8zM200 212h8v8h-8zM56 92h8v8h-8zM192 