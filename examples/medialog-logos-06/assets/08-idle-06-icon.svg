<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Pipe dream symbol</title><desc id="d">Glossy 3D pipes trace an open book in isometric view: a red pipe round the left page, a blue pipe round the right, a yellow gutter pipe between them and shiny ball joints at every corner, with the screensaver’s black space inside the pages and thinner pipes for the lines of text. Primary brand colour #18223a, plain MediaLog wordmark. Pipes run only along the three axes and turn at ball joints, which is exactly what an isometric open book needs; No tangle of pipes: one book-shaped run, with the black space kept inside the pages.</desc><defs><radialGradient id="ball-red" cx="0.36" cy="0.32" r="0.7" fx="0.36" fy="0.32" ><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#ffb3a8"/><stop offset="0.6" stop-color="#e8352b"/><stop offset="1" stop-color="#7a120c"/></radialGradient><radialGradient id="ball-blue" cx="0.36" cy="0.32" r="0.7" fx="0.36" fy="0.32" ><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#b9d4ff"/><stop offset="0.6" stop-color="#2a6be0"/><stop offset="1" stop-color="#0b2a6e"/></radialGradient><radialGradient id="ball-yellow" cx="0.36" cy="0.32" r="0.7" fx="0.36" fy="0.32" ><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#fff2b0"/><stop offset="0.6" stop-color="#f6c20f"/><stop offset="1" stop-color="#7a5a00"/></radialGradient></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M120 110L36.86 62V158L120 206Z" fill="#05070d" /><path d="M120 110L203.14 62V158L120 206Z" fill="#05070d" /><path d="M10