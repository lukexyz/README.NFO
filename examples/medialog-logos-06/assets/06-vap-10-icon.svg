<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Glossy edition symbol</title><desc id="d">A glossy sky-blue hardback with a leaf-green spine, a glass-button highlight across its top half and a ribbon bookmark, standing on its own wet-table reflection with a soap bubble at its corner. Primary brand colour #18223a, plain MediaLog wordmark. Web 2.0 gloss: vertical gradient, a hard-edged highlight band, a mirrored reflection that fades out, and Frutiger Aero bubbles; Sky blue and leaf green with white, kept to one object.</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1" ><stop offset="0" stop-color="#a8e2ff"/><stop offset="0.5" stop-color="#3b9cf0"/><stop offset="1" stop-color="#0f56c2"/></linearGradient><linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1" ><stop offset="0" stop-color="#a6ec6c"/><stop offset="0.55" stop-color="#4cbf3e"/><stop offset="1" stop-color="#1f8a33"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1" ><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/></linearGradient><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1" ><stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/></linearGradient><radialGradient id="bubble" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5" ><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.62" stop-color="#d8f1ff" stop-opacity="0.12"/><stop offset="0.9" stop-color="#8fd0ff" stop-opacity="0.7"/><stop offset="1" stop-color="#e9f7ff" stop-opacity="0.95"/></radialGradient><mask id="wet"><rect x="0" y="202" width="240" height="60" fill="url(#fade)"/></mask><clipPath id="book"><path d="M70 50H174A10 10 0 0 1 184 60V192A10 10 0 0 1 174 202H70A16 16 0 0 1 54 186V6