<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — First draft symbol</title><desc id="d">An open book drawn in rough, doubled pencil lines, still unfinished, with a green pencil lying across it, its point resting at the end of the newest line of text. Primary brand colour #18223a, plain MediaLog wordmark. The self-drawing cracktro: outline only, no fills, a doubled line that skips like chalk on grain, and the pencil caught mid-stroke; The blue paper is left out so the sketch sits straight on the page, in navy on light and cream on dark.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660;--tile:#18223a;--rim:#18223a}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85;--tile:#1d2944;--rim:#5d6f88}}</style><path d="M118 102Q86 84 38 94V198Q84 190 118 210" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M118 102Q86 84 38 94V198Q84 190 118 210" fill="none" stroke="var(--ink)" stroke-width="2.52" stroke-linecap="round" stroke-linejoin="round" opacity=".5" transform="translate(1.8 -1.6)"/><path d="M122 102Q154 84 202 94V198Q156 190 122 210" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M122 102Q154 84 202 94V198Q156 190 122 210" fill="none" stroke="var(--ink)" stroke-width="2.52" stroke-linecap="round" stroke-linejoin="round" opacity=".5" transform="translate(1.8 -1.6)"/><path d="M32 102V206Q84 198 120 218Q156 198 208 206V102" fill="none" stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90 7 60 6 200"/><path d="M32 102V206Q84 198 120 218Q156 198 208 206V102" fill="none" stroke="var(--ink)" stroke-width=