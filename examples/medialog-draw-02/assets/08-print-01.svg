<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">MediaLog — The diary swap</title><desc id="desc">The diary swap. A media diary you share: everything you have watched, read, played and listened to, on one timeline. A fan of disks separates watched, played and listened memories, with the diary on the front label. A handwritten note asks when it was and who should hear about it, turning the swap into a social invitation. Decorative interface examples.</desc><defs></defs><style>
