<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — In your orbit symbol</title><desc id="d">An open diary sits inside one calm orbital line. A single warm point suggests someone else entering the conversation.. Primary brand colour #18223a, plain MediaLog wordmark. The orbit is a connection around a diary rather than a planet; Chrome and techno lettering are removed in favour of navy, line and space.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M40 170C-2 122 158 53 203 102C238 143 78 221 40 170Z" fill="none" stroke="var(--blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 108Q91 94 119 117Q148 94 177 108V183Q148 169 119 191Q89 169 64 183Z" fill="var(--ink)" /><path d="M119 121V181" fill="none" stroke="var(--paper)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M77 126L103 132M136 132L162 126" fill="none" stroke="var(--paper)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="205" cy="107" r="13" fill="var(--accent)" /><path d="M161 187L181 196L166 202Z" fill="var(--ink)" /></svg>
