<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Leave a little note symbol</title><desc id="d">A simple open book and a single confident pen stroke: a quieter continuation of the old MediaLog identity.. Primary brand colour #18223a, plain MediaLog wordmark. The pen records how an experience felt, not just that it happened; Internal film and music symbols are removed so the familiar silhouette reads at a glance.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M30 102Q78 88 119 117Q158 88 202 101V213Q155 198 119 223Q76 198 30 213Z" fill="var(--ink)" /><path d="M44 118Q78 108 109 129V201Q80 184 44 194Z" fill="var(--paper)" /><path d="M128 129Q156 110 188 118V194Q155 184 128 201Z" fill="var(--paper)" /><path d="M126 173L148 162L207 70Q211 61 201 56Q192 51 187 60L132 152Z" fill="var(--accent)" stroke="var(--paper)" stroke-width="5" stroke-linejoin="round"/><path d="M126 173L132 152L148 162Z" fill="var(--ink)" /><path d="M 60 144L88 152" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>
