<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Collected moments symbol</title><desc id="d">Three faceted layers make a small stack of keepsakes, with one warm band crossing the top.. Primary brand colour #18223a, plain MediaLog wordmark. The cube-field grammar becomes a tangible collection of media objects; A limited palette and three large layers replace the rainbow field and tiny cells.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M31 186L119 138L207 186V206L119 254L31 206Z" fill="var(--ink)" /><path d="M31 186L119 234L207 186L119 138Z" fill="var(--soft)" /><path d="M119 234V247" fill="none" stroke="var(--paper)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M31 158L119 110L207 158V178L119 226L31 178Z" fill="var(--blue)" /><path d="M31 158L119 206L207 158L119 110Z" fill="var(--soft)" /><path d="M119 206V219" fill="none" stroke="var(--paper)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M31 130L119 82L207 130V150L119 198L31 150Z" fill="var(--ink)" /><path d="M31 130L119 178L207 130L119 82Z" fill="var(--paper)" /><path d="M119 178V191" fill="none" stroke="var(--paper)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M69 129L119 101L169 129L119 157Z" fill="var(--ink)" /><path d="M118 101L145 116L96 143L69 129Z" fill="var(--accent)" /></svg>
