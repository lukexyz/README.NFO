<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Keep your place symbol</title><desc id="d">Two pages sweep like ribbons, while a warm bookmark folds over the outside edge.. Primary brand colour #18223a, plain MediaLog wordmark. The vertical ribbon reference becomes a tactile part of the diary; The folded accent suggests returning to something you loved.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M34 88C69 74 107 86 119 122C132 85 169 74 205 88V216C166 200 133 204 119 225C103 204 70 199 34 216Z" fill="var(--ink)" /><path d="M52 105C76 100 99 114 104 137V193C91 184 73 180 52 186Z" fill="var(--paper)" /><path d="M136 137C143 114 165 100 189 105V186C166 180 149 184 136 193Z" fill="var(--paper)" /><path d="M181 83C204 102 195 132 175 159L160 147C178 119 184 106 168 89Z" fill="var(--accent)" /></svg>
