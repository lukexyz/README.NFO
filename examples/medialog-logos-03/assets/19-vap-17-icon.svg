<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — A little off-script symbol</title><desc id="d">A rounded left page, an angular right page and a folded bookmark. A book with a little personality in its proportions.. Primary brand colour #18223a, plain MediaLog wordmark. The asymmetric shapes carry the playful reference; A navy foundation and one warm accent keep the composition calm.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M32 119C54 77 97 81 114 109V211C82 182 58 182 32 193Z" fill="var(--ink)" /><path d="M127 110L205 87V188L127 213Z" fill="var(--blue)" /><path d="M145 120L177 110L180 153L165 144L150 161Z" fill="var(--accent)" /><path d="M42 210Q 80 201 119 229Q164 201 205 205" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="62" cy="70" r="10" fill="var(--accent)" /></svg>
