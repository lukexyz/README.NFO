<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — A shelf of your own symbol</title><desc id="d">Three substantial spines and one leaning volume. A small personal library for every kind of media.. Primary brand colour #18223a, plain MediaLog wordmark. Unequal heights suggest different experiences sharing one shelf; The chunky block reference is confined to the emblem; the title is normal type.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><rect x="32" y="92" width="43" height="122" fill="var(--ink)" rx="5"/><rect x="86" y="70" width="43" height="144" fill="var(--ink)" rx="5"/><path d="M142 87L181 76L216 200L177 211Z" fill="var(--blue)" /><path d="M46 113H62M46 188H62M99 93H116M99 185H116" fill="none" stroke="var(--paper)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M158 106L174 102" fill="none" stroke="var(--paper)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="31" y="226" width="188" height="9" fill="var(--ink)" rx="4"/><rect x="99" y="120" width="17" height="30" fill="var(--accent)" rx="2"/></svg>
