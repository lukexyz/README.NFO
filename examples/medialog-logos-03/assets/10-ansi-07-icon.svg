<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Open invitation symbol</title><desc id="d">A generous open journal with gently fanned pages and a small fabric bookmark.. Primary brand colour #18223a, plain MediaLog wordmark. Strong plotted outlines keep the book friendly and legible; A slightly asymmetric bookmark gives the simple navy drawing a personal touch.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M35 101Q76 79 119 112Q160 79 202 101L213 206Q161 185 119 214Q76 185 25 206Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="10" stroke-linejoin="round"/><path d="M119 115V212M49 119L92 137M49 146L87 162M148 134L184 120" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M156 80L172 76L181 115L169 109L163 121Z" fill="var(--accent)" /><path d="M39 221Q 80 205 119 229Q158 205 200 221" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></svg>
