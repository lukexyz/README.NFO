<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — The shared journal symbol</title><desc id="d">A guestbook becomes a conversation bubble, with a warm bookmark tucked into the right page.. Primary brand colour #18223a, plain MediaLog wordmark. The speech tail makes the diary feel shared; The personal-web reference comes through its guestbook idea, with all interface clutter removed.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M32 90Q77 76 119 101Q161 76 206 90V193Q169 184 141 199L115 226V207Q76 181 32 195Z" fill="var(--ink)" /><path d="M45 104Q77 95 109 114V185Q79 168 45 178Z" fill="var(--paper)" /><path d="M128 114Q159 95 192 104V178Q157 168 128 185Z" fill="var(--paper)" /><path d="M154 100H171V150L162 142L154 150Z" fill="var(--accent)" /><path d="M62 128L91 137M62 152L85 160" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg>
