<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — A window into it symbol</title><desc id="d">A softly framed book opens onto two quiet landscape shapes. Stories are a way into another world.. Primary brand colour #18223a, plain MediaLog wordmark. The window-and-landscape reference becomes an open volume; Two broad page planes carry the idea without clouds, buttons or screen labels.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><rect x="34" y="68" width="171" height="165" fill="var(--ink)" rx="27"/><path d="M51 92H112V186Q81 174 51 188Z" fill="var(--paper)" /><path d="M125 92H188V188Q157 174 125 186Z" fill="var(--paper)" /><path d="M51 155Q78 125 112 149V186Q81 174 51 188Z" fill="var(--blue)" /><path d="M125 149Q162 120 188 147V188Q157 174 125 186Z" fill="var(--accent)" /><path d="M119  90 V210" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 209Q88 202 119 215Q153 202 181 209" fill="none" stroke="var(--paper)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg>
