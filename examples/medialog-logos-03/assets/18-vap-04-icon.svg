<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Worth remembering symbol</title><desc id="d">A diary page and a clear clock face make a small mark for when it happened, as well as what it was.. Primary brand colour #18223a, plain MediaLog wordmark. The daily bulletin reference becomes a personal dated entry; One clock replaces all the tiny data rows, keeping the symbol readable.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><rect x="38" y="79" width="166" height="157" fill="var(--ink)" rx="20"/><rect x="51" y="109" width="140" height="113" fill="var(--paper)" rx="8"/><path d="M77 68V92M165 68V92" fill="none" stroke="var(--blue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><circle cx="121" cy="165" r="38" fill="none" stroke="var(--ink)" stroke-width="8"/><path d="M121 141V165L142 177" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="178" cy="92" r="5" fill="var(--accent)" /></svg>
