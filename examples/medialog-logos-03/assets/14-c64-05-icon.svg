<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — The bookplate symbol</title><desc id="d">A navy badge holding a cream open book, edged like a small stamped ownership plate.. Primary brand colour #18223a, plain MediaLog wordmark. The badge gives the diary a clear standalone app identity; One warm bookmark replaces the source’s rainbow ornament.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><rect x="28" y="68" width="183" height="165" fill="#18223a" rx="35"/><rect x="38" y="78" width="163" height="145" fill="none" rx="27" stroke="#74889a" stroke-width="4"/><path d="M64 110Q 90 99 119 117Q147 99 176 110V186Q146 177 119 195Q 90 177 64 186Z" fill="#f6f3eb" /><path d="M119 120V188" fill="none" stroke="#18223a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M148 109H162V152L155 146L148 152Z" fill="var(--accent)" /></svg>
