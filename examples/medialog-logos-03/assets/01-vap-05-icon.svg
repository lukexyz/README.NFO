<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — The next chapter symbol</title><desc id="d">An open book becomes a small horizon, with a warm sun rising behind its pages.. Primary brand colour #18223a, plain MediaLog wordmark. The receding landscape becomes the fold of a diary; One quiet ochre sun replaces the neon palette; the name stays plain.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><circle cx="121" cy="116" r="53" fill="var(--accent)" /><path d="M30 122Q73 106 119 133Q162 106 209 122V207Q163 189 119 216Q75 189 30 207Z" fill="var(--ink)" /><path d="M43 137Q79 126 110 146V194Q77 178 43 190Z" fill="var(--paper)" /><path d="M129 146Q164 126 196 137V190Q163 178 129 194Z" fill="var(--paper)" /><path d="M63 151L94 157M146 157L178 151" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M66 175L94 180M146 180L176 175" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg>
