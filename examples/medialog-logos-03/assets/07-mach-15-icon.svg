<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — A path through it symbol</title><desc id="d">Pages unfold into a small landscape, with one warm route running from the foreground to the next chapter.. Primary brand colour #18223a, plain MediaLog wordmark. Perspective makes a timeline feel like a journey through a diary; The ground-plane reference becomes a solid page silhouette rather than a decorative scene.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M26 187L68 85L119 108L176 85L216 187L124 226Z" fill="var(--ink)" /><path d="M43 179L76 102L111 118V205Z" fill="var(--paper)" /><path d="M127 118L169 103L198 179L129 205Z" fill="var(--soft)" /><path d="M69 169L89 131M150 130L170 169" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M116 211L124 177L119 145L124 113" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="124" cy="103" r="10" fill="var(--accent)" /></svg>
