<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Pass it on symbol</title><desc id="d">A hand offers a small bookmarked journal. The symbol is about keeping something, then sharing it with someone.. Primary brand colour #18223a, plain MediaLog wordmark. The hand echoes the reference’s simple plotted drawing; The offered object is a diary, connecting personal records with recommendations.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M71  70 H162Q176 70 176 85V166H71Z" fill="var(--ink)" /><path d="M85 83H158V147H85Z" fill="var(--paper)" /><path d="M131 83H149V123L140 115L131 123Z" fill="var(--accent)" /><path d="M29 198L55 171L91 175L115 160Q126 154 134 165Q140 175 128 184L106 198H151L189 163Q201 154 209 165Q215 175 205 186L166 224H79L50 238Z" fill="var(--blue)" stroke="var(--ink)" stroke-width="8" stroke-linejoin="round"/><path d="M51 177L77 219" fill="none" stroke="var(--paper)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg>
