<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Filed favourites symbol</title><desc id="d">Four carefully arranged tiles hold a play mark, a line and a bookmark. Different media, one orderly place.. Primary brand colour #18223a, plain MediaLog wordmark. The tracker’s modular panels become a compact collection symbol; Large cutouts stand in for media types, with no tiny notes, counters or labels.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><rect x="32" y="69" width="174" height="161" fill="var(--ink)" rx="19"/><rect x="48" y="86" width="66" height="57" fill="var(--paper)" rx="5"/><rect x="125" y="86" width="65" height="57" fill="var(--blue)" rx="5"/><rect x="48" y="154" width="66" height="59" fill="var(--blue)" rx="5"/><rect x="125" y="154" width="65" height="59" fill="var(--paper)" rx="5"/><path d="M68 97L95 114L68 132Z" fill="var(--ink)" /><path d="M64 184H96M157 168V198" fill="none" stroke="var(--paper)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M146 154H169V190L157 181L146 190Z" fill="var(--accent)" /></svg>
