<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 28 240 240" role="img" aria-labelledby="t d"><!-- Original MediaLog emblem: MIT. Wordmark: DejaVu Sans; retain LICENSE.FONT.txt. --><title id="t">MediaLog — Read between the beats symbol</title><desc id="d">A simple waveform runs through an open diary. Listening and reading share the same continuous line.. Primary brand colour #18223a, plain MediaLog wordmark. The scope line is turned into one coherent book symbol; The warm trace is secondary to the large navy silhouette.</desc><defs></defs><style>:root{--ink:#18223a;--paper:#f6f3eb;--soft:#d9e0e5;--blue:#74889a;--accent:#ae8660}@media(prefers-color-scheme:dark){:root{--ink:#f6f3eb;--paper:#18223a;--soft:#53647a;--blue:#a4b3bf;--accent:#d0ac85}}</style><path d="M32 181V110Q67 98 94 116L119 146L144 116Q174 98 208 110V181Q169 170 119 206Q70 170 32 181Z" fill="none" stroke="var(--ink)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 151H68L80 131L95 170L119 145L143 168L157 130L171 151H192" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M119 150V206" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /></svg>
