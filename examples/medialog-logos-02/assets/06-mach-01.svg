<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Colour arrives last</title><desc id="d">Four bright memory tabs stack into a play-shaped badge. Spectrum-era loading colours become an instantly recognisable archive mark.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; Overlapping tabs suggest moments filed in chronological order; One shared play cutout unites the stack without adding tiny media icons.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


