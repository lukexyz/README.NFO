<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Blue sky diary</title><desc id="d">A glossy blue orb holds an open diary, with a green leaf tucked into it. Bright, optimistic glass-era branding with generous, readable lettering.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The orb gathers multiple experiences into a single place; The leaf suggests a growing personal collection, not a software status badge.</desc><defs><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8ecff"/><stop offset="0.48" stop-color="#269ede"/><stop offset="0.49" stop-color="#0879c2"/><stop offset="1" stop-color="#62cce1"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}
.sheen{animation:sheen 6s ease-in-out infinite}@keyframes sheen{50%{opacity:.4}}

