<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Margin notes</title><desc id="d">A folded culture zine with a purple star tucked into its pages. A painted editorial identity for a diary with opinions.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The star is a remembered favourite, drawn into the open publication; Broad serif lettering echoes a diskmag masthead without reproducing its tiny article columns.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


