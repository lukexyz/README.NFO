<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Pocket premiere</title><desc id="d">A teal gadget with a glowing play window: your entire cultural life feels like something worth carrying around.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The projector window turns a software skin into a compact media emblem; Two simple controls suggest remembering and sharing without inventing interface labels.</desc><defs><linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70c9c8"/><stop offset="0.45" stop-color="#2d7c85"/><stop offset="1" stop-color="#173a54"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

