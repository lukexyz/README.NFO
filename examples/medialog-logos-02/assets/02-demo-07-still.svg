<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Your name on the ticket</title><desc id="d">A bold premiere ticket and oversized warm-white lettering. The collection gets the same billing as the films, books and records inside it.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; A punched ticket is the shared invitation; Projector-scale typography is kept large enough to read across a tiny navigation bar.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

