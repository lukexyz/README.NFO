<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Pressed into memory</title><desc id="d">An emerald plasma seal with carved, pale serif lettering. The emblem is a moment preserved inside a triangular frame.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The enclosed bright point is a saved experience; Embossed lettering suggests a memory pressed into a lasting material.</desc><defs><linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17493b"/><stop offset="0.45" stop-color="#428f68"/><stop offset="0.65" stop-color="#255945"/><stop offset="1" stop-color="#112c2c"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

