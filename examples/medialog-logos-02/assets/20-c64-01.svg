<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — The watching eye</title><desc id="d">A raster-banded eye hides a play arrow at its centre. Watching becomes noticing—and keeping a record of what mattered.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The eye is drawn as a single memorable silhouette rather than a literal screen; One palette flows through both emblem and wordmark, making the whole lockup feel unified.</desc><defs><linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce8c7"/><stop offset="0.3" stop-color="#dce8c7"/><stop offset="0.3" stop-color="#84c3c5"/><stop offset="0.56" stop-color="#84c3c5"/><stop offset="0.56" stop-color="#8893d2"/><stop offset="0.8" stop-color="#8893d2"/><stop offset="0.8" stop-color="#b18cb7"/><stop offset="1" stop-color="#b18cb7"/></linearGradient><linearGradient id="title" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="77"><stop offset="0" stop-color="#dce8c7"/><stop offset="0.3" stop-color="#dce8c7"/><stop offset="0.3" stop-color="#84c3c5"/><stop offset="0.56" stop-color="#84c3c5"/><stop offset="0.56" stop-color="#8893d2"/><stop offset="0.8" stop-color="#8893d2"/><stop offset="0.8" stop-color="#b18cb7"/><stop offset="1" stop-color="#b18cb7"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


