<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — One more chapter</title><desc id="d">A tiny original cat curls up on a book under a crescent moon. A quiet visual-novel vignette for the stories you keep returning to.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; A reader’s companion combines the social and reading sides of MediaLog; Moon, face and book are reduced to large silhouettes so the mascot survives at small size.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

