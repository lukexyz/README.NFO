<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Pocket mixtape</title><desc id="d">A cyan-and-pink phrase grid forms a heart inside a handheld badge. A playful identity for the patterns in what you love.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The tracker cursor becomes a play arrow for your own mix; One large heart replaces tiny note codes while retaining the reference’s palette and grid structure.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


