<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Chrome keepsake</title><desc id="d">A polished, faceted keepsake and an extruded wordmark with a sharp reflected horizon. More like an engraved personal badge than a screen.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; Two folded chevrons inside the gem suggest stacked saved moments; Cool sky and warm ground share the same lettering, linking past and present.</desc><defs><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6c5ff"/><stop offset="0.22" stop-color="#dbe5ff"/><stop offset="0.22" stop-color="#8490cd"/><stop offset="0.45" stop-color="#f1fbff"/><stop offset="0.49" stop-color="#f1fbff"/><stop offset="0.5" stop-color="#532647"/><stop offset="0.7" stop-color="#b56e73"/><stop offset="0.7" stop-color="#efb283"/><stop offset="1" stop-color="#ffe0aa"/></linearGradient><linearGradient id="letters" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="90"><stop offset="0" stop-color="#b6c5ff"/><stop offset="0.22" stop-color="#dbe5ff"/><stop offset="0.22" stop-color="#8490cd"/><stop offset="0.45" stop-color="#f1fbff"/><stop offset="0.49" stop-color="#f1fbff"/><stop offset="0.5" stop-color="#532647"/><stop offset="0.7" stop-color="#b56e73"/><stop offset="0.7" stop-color="#efb283"/><stop offset="1" stop-color="#ffe0aa"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


