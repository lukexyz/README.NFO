<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — You had to be there</title><desc id="d">Two overlapping chat bubbles, a green presence light and an easy blue wordmark. A favourite becomes a conversation.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; Two distinct bubbles stand for you and the people you know; The typing dots suggest swapping recommendations, with no fake notification counts.</desc><defs><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9e9ff"/><stop offset="1" stop-color="#3988c2"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcf6aa"/><stop offset="1" stop-color="#73b955"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}
.typing{animation:typing 4.8s ease-in-out infinite}.second{animation-delay:.35s}.third{animation-delay:.7s}@keyframes typing{40%{opacity:.6}}
*{animation:none!important;transition:none!important}
