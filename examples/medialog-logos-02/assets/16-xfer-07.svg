<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Passed around</title><desc id="d">Three coloured tiles travel in a circle at the end of a two-tone wordmark. One person’s discovery becomes another person’s next favourite.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The P2P chunk vocabulary becomes a social exchange rather than transfer statistics; The emblem follows the title, making a different horizontal rhythm from the other marks.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}


