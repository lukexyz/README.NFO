<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — After-hours favourites</title><desc id="d">A pink neon heart with a cyan play cutout, beside a clean tube-letter wordmark. Your late-night discoveries have a place to glow.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; A heart and play sign combine emotional reaction with watching; The composition removes street labels and rain so the name stays clear at navigation size.</desc><defs><filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="5"/></filter></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

