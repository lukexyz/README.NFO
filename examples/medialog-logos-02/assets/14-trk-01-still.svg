<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Four-track mind</title><desc id="d">Four chunky tracks and a golden waveform sit inside a brushed-grey badge. Watching, reading, playing and listening become parts of the same mix.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; Four large tracks directly reference the four verbs in the brief; The waveform runs continuously across them, expressing one shared timeline.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

