<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — One continuous loop</title><desc id="d">A thick multicolour ribbon folds into an infinity loop. Different kinds of media become one continuous history.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; Two looping paths join into a single diary rather than separate libraries; Broad copper bands survive reduction to 203 pixels.</desc><defs><linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60bfc5"/><stop offset="0.32" stop-color="#60bfc5"/><stop offset="0.32" stop-color="#819be1"/><stop offset="0.5" stop-color="#819be1"/><stop offset="0.5" stop-color="#c97eab"/><stop offset="0.72" stop-color="#c97eab"/><stop offset="0.72" stop-color="#e99b60"/><stop offset="1" stop-color="#e99b60"/></linearGradient><linearGradient id="type" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="77"><stop offset="0" stop-color="#60bfc5"/><stop offset="0.32" stop-color="#60bfc5"/><stop offset="0.32" stop-color="#819be1"/><stop offset="0.5" stop-color="#819be1"/><stop offset="0.5" stop-color="#c97eab"/><stop offset="0.72" stop-color="#c97eab"/><stop offset="0.72" stop-color="#e99b60"/><stop offset="1" stop-color="#e99b60"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

