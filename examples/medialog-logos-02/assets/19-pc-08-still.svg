<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Favourite mode</title><desc id="d">An oversized green toggle with a heart built into its switch. The trainer-screen energy becomes a simple invitation to save what you loved.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The toggle expresses a personal favourite instead of a software cheat or capability; A heavy slanted title carries the arcade energy without tiny key labels.</desc><defs><linearGradient id="acid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f18c"/><stop offset="1" stop-color="#73ba7c"/></linearGradient></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

*{animation:none!important;transition:none!important}
