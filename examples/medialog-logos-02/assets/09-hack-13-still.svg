<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Culture radar</title><desc id="d">A glowing globe carries a few bright recommendation routes. What your friends discover finds its way into your timeline.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The routes represent shared taste rather than geographic tracking; Three large blips replace the reference’s dense counters and labels.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

