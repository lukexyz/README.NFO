<svg xmlns="http://www.w3.org/2000/svg" width="203" height="74" viewBox="0 0 812 296" role="img" aria-labelledby="t d"><title id="t">MediaLog — Pocket nostalgia</title><desc id="d">A two-tone handset badge with a tiny winding path on its screen. A diary that fits in your pocket, with the calm simplicity of an old LCD.. Original logo and wordmark for a shared media diary. Designed for 203 by 74 pixels; The screen path is a timeline reaching a saved square; Only two tones and a few large shapes are used; no status text or character art.</desc><defs></defs><style>:root{--ink:#172239;--paper:#ecf0f3;--subtle:#c4ccd5;--white:#ffffff}@media(prefers-color-scheme:dark){:root{--ink:#f1f6fb;--paper:#111722;--subtle:#394559;--white:#ffffff}}

